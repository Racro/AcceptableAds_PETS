version: '3.8'

services:
  # Crawler Services
  crawler-control:
    image: racro/accads:latest
    container_name: accads-crawler-control
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data/control:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/control
      - ./data/adblock:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/adblock
      - ./data/shared:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/shared
      - ./config:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/config
    environment:
      - CRAWLER_TYPE=control
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  crawler-adblock:
    image: racro/accads:latest
    container_name: accads-crawler-adblock
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data/control:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/control
      - ./data/adblock:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/adblock
      - ./data/shared:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/shared
      - ./config:/home/chromiumuser/AcceptableAds_PETS/accads_crawler/config
    environment:
      - CRAWLER_TYPE=adblock
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Processing Service
  processing:
    build:
      context: ./docker/processing
      dockerfile: Dockerfile
    container_name: accads-processing
    volumes:
      - ./data:/app/data
      - ./image_hashing:/app/image_hashing
      - ./processing_scripts:/app/processing_scripts
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0' 